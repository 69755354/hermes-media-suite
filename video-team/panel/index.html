<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>火龙片场 · 团队看板</title>
<style>
:root{--bg:#0b0f14;--card:#111820;--line:#1e2a36;--txt:#e6edf3;--dim:#7d8b99;--ok:#2ea043;--work:#3b82f6;--block:#f85149;--ready:#8b949e;--gold:#d7a94a}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 15% -10%,#16222e 0%,var(--bg) 55%);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;padding:28px 32px}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:22px;letter-spacing:.5px;font-weight:600}
h1 span{color:var(--gold)}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.live{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.kpis{display:flex;gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:96px}
.kpi b{display:block;font-size:20px}
.kpi i{font-style:normal;color:var(--dim);font-size:11px}
.wrap{display:grid;grid-template-columns:1fr 320px;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.t{display:flex;align-items:center;gap:10px}
.t b{font-size:15px}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.stages{display:flex;gap:6px;margin:14px 0 10px}
.st{flex:1;text-align:center;font-size:11px;color:var(--dim);padding:7px 0;border-radius:6px;border:1px solid var(--line);background:#0d141b;position:relative}
.st.done{color:#9be9a8;border-color:#1f6f36;background:#0f1f16}
.st.working{color:#bcd4ff;border-color:#2b5cab;background:#10203a;animation:pulse 2s infinite}
.st.blocked{color:#ffb4ae;border-color:#8b2c26;background:#241110}
.st.ready{color:#d0d7de;border-color:#3a4652}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.0)}50%{box-shadow:0 0 0 4px rgba(59,130,246,.12)}}
.bar{height:5px;background:#0a1117;border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d7a94a,#f0c66b)}
.meta{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px}
.blockbox{margin-top:10px;border-left:3px solid var(--block);background:#1a1010;padding:8px 10px;border-radius:4px;color:#ffb4ae;font-size:12px}
aside .card{padding:14px 16px}
h3{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:1px;margin-bottom:10px}
.role{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed #18222c}
.role:last-child{border:0}
.role i{font-style:normal;color:var(--dim)}
.ev{font-size:11px;color:var(--dim);padding:6px 0;border-bottom:1px solid #131c25;display:flex;gap:8px}
.ev b{color:#c9d1d9;font-weight:500;white-space:nowrap}
.empty{color:var(--dim);font-size:13px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}
</style></head><body>
<header>
  <div><h1>火龙<span>片场</span> · 团队看板</h1><div class="sub">团长 Hermes 只调度 · 视频组 / 审核组 / 发布组 / 数据组</div></div>
  <div class="live"><span class="dot"></span><span id="clock">--:--:--</span> 只读实时视图</div>
</header>
<div class="kpis">
  <div class="kpi"><b id="k1">0</b><i>在跑</i></div>
  <div class="kpi"><b id="k2" style="color:var(--block)">0</b><i>卡住</i></div>
  <div class="kpi"><b id="k3">0</b><i>今日完成</i></div>
  <div class="kpi"><b id="k4">0</b><i>付费调用</i></div>
</div>
<div class="wrap">
  <main id="list"></main>
  <aside>
    <div class="card"><h3>角色</h3><div id="roles"></div></div>
    <div class="card"><h3>最近事件</h3><div id="events"></div></div>
  </aside>
</div>
<script>
const SN={TOPIC:"选题",COPY:"文案",STORYBOARD:"分镜",MEDIA:"生成",COMPOSE:"合成",COMPLIANCE:"合规",PUBLISH:"发布",COLLECT:"取数",REVIEW:"复盘"};
const ORDER=["TOPIC","COPY","STORYBOARD","MEDIA","COMPOSE","COMPLIANCE","PUBLISH","COLLECT","REVIEW"];
const ROLE={leader:"团长",production:"视频组",review:"审核组",publish:"发布组",data:"数据组"};
function esc(s){return (s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
async function tick(){
  const r=await fetch("api/board");const d=await r.json();
  let run=0,block=0,done=0,calls=0;
  const list=d.tasks.length?d.tasks.map(x=>{
    const t=x.task, st={}; x.stages.forEach(s=>st[s.stage_id]=s);
    x.stages.forEach(s=>{if(s.status==="working")run++;if(s.status==="blocked")block++;if(s.status==="done")done++;calls+=s.used_calls});
    const cur=x.stages.find(s=>["working","blocked"].includes(s.status))||x.stages.find(s=>s.status==="ready");
    const chips=ORDER.map(id=>{const s=st[id]||{status:"pending"};return `<div class="st ${s.status}" title="${ROLE[s.assignee]||''}">${SN[id]}</div>`}).join("");
    const blk=cur&&cur.status==="blocked"?`<div class="blockbox">卡点：${esc(cur.blocked_reason)} · 下一处理者 ${ROLE[cur.blocked_next]||cur.blocked_next||"团长"}</div>`:"";
    const used=x.stages.reduce((a,s)=>a+s.used_calls,0);
    const pct=Math.min(100,Math.round(used/Math.max(1,t.budget_calls)*100));
    return `<div class="card"><div class="t"><b>${esc(t.title)}</b><span class="tag">${t.id}</span><span class="tag">${esc(t.batch)}</span><span class="tag">${esc(t.account)}</span><span class="tag">${cur?ROLE[cur.assignee]||"":""} ${cur?SN[cur.stage_id]:""}</span></div>
    <div class="stages">${chips}</div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>付费调用 ${used} / ${t.budget_calls}</span><span>${x.artifacts.length} 个产出物</span></div>${blk}</div>`}).join("")
    : `<div class="empty">看板是空的 · 用 teamctl add 建第一张片</div>`;
  document.getElementById("list").innerHTML=list;
  k1.textContent=run;k2.textContent=block;k3.textContent=done;k4.textContent=calls;
  document.getElementById("roles").innerHTML=Object.entries(ROLE).map(([k,v])=>`<div class="role"><span>${v}</span><i>${esc((d.roles[k]||{}).who||"")}</i></div>`).join("");
  document.getElementById("events").innerHTML=d.events.slice(0,12).map(e=>`<div class="ev"><b>${(e.ts||"").slice(11,19)}</b><span>${esc(e.task_id)} ${SN[e.stage_id]||""} ${esc(e.kind)}</span></div>`).join("")||`<div class="ev">暂无事件</div>`;
}
tick();setInterval(tick,3000);
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false})},1000);
</script></body></html>
