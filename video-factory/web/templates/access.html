{% extends "base.html" %}
<!-- > 执行者：codex -->
{% block title %}积分验证{% endblock %}
{% block content %}
<section class="card auth">
  <p class="eyebrow">积分入口</p>
  <h1>先验证积分，再开始制作</h1>
  <p class="muted">请输入天行者分配的数值客户编号。积分为 0 时不能使用，请联系管理员充值。</p>
  <form id="access-form">
    <label>客户编号
      <input name="customer_id" inputmode="numeric" autocomplete="off" maxlength="18" placeholder="例如：1024" required>
    </label>
    <button class="primary" type="submit">查询积分并进入</button>
    <p id="access-error" class="error"></p>
  </form>
</section>
{% endblock %}
