{% extends "base.html" %}{% block title %}{{ title }}确认{% endblock %}{% block content %}<section class="card confirm-card"><p class="eyebrow">需要你明确确认</p><h1>{{ title }}</h1><p class="lead">你确认的是内容方向、门店事实与表达习惯；不覆盖商业效果。</p><div id="confirm-preview" class="preview"><p>正在加载需要确认的内容…</p></div><div class="confirm-actions"><button class="primary" id="confirm-ok">没意见，继续</button><button class="ghost" id="confirm-revise">我要修改</button><button class="ghost" id="confirm-pause">我还没看完，请联系我</button></div><form id="revision-form" class="hidden"><label>改哪一块<select name="scope"><option value="copy">说法</option><option value="topic">拍什么</option><option value="typo">错字</option>{% if item.confirm_id == 'C2' %}<option value="shot">画面</option><option value="technical">技术问题</option>{% endif %}</select></label><label>具体说明<textarea name="note" required></textarea></label><label>修改归因<select name="attribution"><option value="client_taste_change">同范围口味调整</option><option value="client_fact_correction">事实纠错</option><option value="our_error">我方错误</option><option value="client_scope_expansion">范围扩张</option></select></label><button class="primary" type="submit">提交修改</button></form><p id="confirm-message"></p></section>{% endblock %}{% block scripts %}<script>window.PROJECT_ID={{ project_id|tojson }};window.CONFIRM_ID={{ item.confirm_id|tojson }};window.CONFIRM_REVISION={{ item.revision|tojson }};window.PAGE='confirm';</script>{% endblock %}
