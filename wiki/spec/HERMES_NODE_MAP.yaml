# =====================================================================
# classify｜三态判定规则（workflow_ticket.py classify "<需求文本>" 读取本块）
# 输出契约：{"state": "...", "track": "...", "candidate_nodes": ["TRACK.NODE", ...], "mode": "card|full|null",
#            "matched": [{"rule": "...", "evidence": "..."}]}
# guard 生成 block message 时调同一函数 —— 判定逻辑集中一处，SOUL 里只留三行摘要。
# =====================================================================
classify:

  # 判定顺序：数值大者先判，命中即定态（对外交付优先级最高，见 arbitration.delivery_wins）
  states:

    external_delivery:
      priority: 30
      name: 对外交付态
      # 「对外」不按跟谁说话判，按产物会不会离开内网判
      any_of:
        - ticket_output_class_is: external_delivery
        - tool_class_is: OUTBOUND
        - keyword_any: ["发客户", "给客户", "客户版", "对外", "发出去", "转星广", "发给第三方", "交付给"]
        - target_channel_any: ["feishu", "webhook", "email", "sms", "外部URL"]
      rules:
        desensitize: true
        forbid_patterns:
          - "/home/ubuntu/"        # 服务器内部路径
          - "/tmp/projects/"
          - "MEDIA/"
          - "T-(CONTENT|ORCHESTRA|ATTRIBUTION|DECISION|OPS)\\."   # 内部轨名/节点号
          - "huoshan#节点\\d+"
          - "\\b(codex|claude|DeepSeek|DS)\\b"                    # 执行器名
          - "^(思考|推演|我的判断)"                                 # 思考过程
        require:
          - link_on_own_line       # 链接独立一行、纯文本、无标点包裹
          - product_plus_usage_only
        physical_check_point: "闸一 OUTBOUND 分支 → feishu_send_gate.py；ticket close 按 output_class 跑脱敏正则，命中即 BLOCK"

    workflow:
      priority: 20
      name: 工作流态
      any_of:
        - trigger_hit_in_node_map: true        # 命中任一节点的 triggers
        - mentions_project_or_store_name: true
        - project_dir_exists: true
        - explicitly_wants_artifact: true      # 老板明确要产物
        - tool_class_any: [PRODUCE, DELEGATE, OUTBOUND, TERMINAL]
      rules:
        require_ticket: true                   # 必须 open 票据，persona 由脚本注入，LLM 不自证
        follow_node_order: true
        pass_exit_gate: true
        label_prefix: "【轨:T-XXX｜节点:YYY】"
        physical_check_point: "闸一按 tool_name + 参数反推，不依赖 LLM 自觉：任何 PRODUCE/DELEGATE/OUTBOUND/TERMINAL 动作即判工作流态"

    internal_interaction:
      priority: 10
      name: 内部交互态
      any_of:
        - keyword_any: ["查一下", "什么状态", "进度", "路径是啥", "怎么看", "你觉得", "顺嘴问"]
        - is_status_query: true
        - is_path_confirmation: true
        - wants_verbal_judgment_only: true     # 老板要口头判断不要产物
      rules:
        load_business_persona: false           # 纯框架态
        style: 客观简洁，可展示推演
        forbid_landed_artifact: true           # 不许产出落盘产物
        physical_check_point: "闸一 READONLY 分支放行；一旦要写产物自动切工作流态并要票据"

  # 工具动作分类（guard 反推态别用；与 §4.1 闸一分支一一对应）
  tool_classes:
    READONLY: {action: pass, examples: [read_file, list_dir, grep, status 查询]}
    PRODUCE:
      action: require_ticket
      examples: [write_file, edit_file, 生成产物]
      extra_check: [executor_tag, "guard/** 与 hashes/** 前缀写入一律 BLOCK（不看票据）"]
    DELEGATE:
      action: require_ticket
      require_track: T-ORCHESTRA
      examples: [派 codex, 派 claude, 派 DS]
      reason: 不打包就甩给执行器 = BLOCKED
    OUTBOUND:
      action: require_ticket_and_gate
      gate: feishu_send_gate.py
      examples: [飞书发送, 外发链接]
    TERMINAL:
      action: block_if_bot_domain
      examples: [直连 Helper API 1888, Seedance, Seedream, 婵镜, 火山 ARK]
      rule: >-
        Bot 域节点（T-CONTENT.INFO_COLLECT … T-CONTENT.STORYBOARD）禁直连，一切渲染 POST /execute(1889)。
        唯一例外：段1 经 Helper API /seedream 生图合法。
      exempt_nodes: [T-CONTENT.IMAGE_GEN, T-CONTENT.RENDER, T-OPS.MEDIA_PREP, T-OPS.MEDIA_PRODUCTION]

  # 边界仲裁（三条，同时写进 L0 框架层 SOUL 摘要）
  arbitration:
    - id: uncertain_rounds_up
      rule: 内部交互 vs 工作流拿不准 → 按工作流走
      why: 多开一张票据的成本远低于跳流程返工
    - id: one_input_can_cross_states
      rule: 一句话既问判断又要产物 → 先内部交互给判断，产物部分单独开票据，不合并
    - id: delivery_wins
      rule: 一旦命中对外交付，脱敏规则覆盖所有 persona 与轨的输出偏好

  # 分轨提示词（trigger 命中多轨时用它定轨；命中多轨且分不清 → 走 T-ORCHESTRA.INTAKE 先受理）
  track_hints:
    T-CONTENT: ["视频", "文案", "分镜", "出片", "生图", "选题", "剧本", "口播", "探店", "小红书图文"]
    T-ORCHESTRA: ["派活", "打包", "互评", "终审", "多执行器", "codex", "claude", "降级", "谁来做"]
    T-ATTRIBUTION: ["归因", "星广", "PRD", "指标", "数据契约", "触点", "系统架构"]
    T-DECISION: ["决策", "方案", "要不要", "选哪个", "五智囊", "六顶帽子", "拍板"]
    T-OPS: ["立项", "诊断", "打法", "基建", "排期", "线索", "成交", "复购", "周复盘", "月报", "客户运营"]
    tie_breaker: T-ORCHESTRA.INTAKE

  # 决策轨模式判据（错一次的代价定轻重，项目大小不作判据）
  decision_mode_rule:
    card: 错了=重写一次（文案/创作类）→ FRAME → CHAIR，10 分钟，≤一页纸
    full: 错了=全链路返工/丢客户/方向错（策略/决策/分析类）→ FRAME → COUNCIL → HATS → CHAIR
    forbid: 策略类用卡片糊弄；创作类上完整版（太重会被弃用）

# =====================================================================
# 合规红线（命中即 COMPLIANCE:，与节点无关，全轨生效）
# 详见 /home/ubuntu/.hermes/skills/newmedia-operations/content-redlines/SKILL.md
# =====================================================================
compliance_redlines:
  scope: all_tracks
  skill: /home/ubuntu/.hermes/skills/newmedia-operations/content-redlines/SKILL.md
  industry_rules:
    餐饮: 禁极限词/绝对化用语
    医美健康: 禁疗效承诺、禁产品横向对比
    保健养生: 普通食品禁绑病症/禁医疗动词；保健食品仅可宣传备案功效
    教育培训: 禁结果承诺；K12 学科全封禁；职业教育禁包就业
    金融理财: 禁收益承诺/荐股/晒收益；无牌照禁讲解
    风水命理: 禁玄学禁词/恐吓营销/付费命理；允许传统文化空间设计
    情感: 风控适度放宽，严控负面引导
  global: 送客词禁令——禁把读者导向第三方免费替代服务，客户明确要求才放行
  data_discipline: 市场数据必须真实来源，禁编造；素材基于公开流传，明显编造过滤
