        artifact_format_checks: [executor_tag, local_file_exists]  # 产物必须为 local_file，不接受描述

      QC:
        name: 视频最终检验
        legacy_ref: "huoshan#节点14"
        persona: wiki/personas/persona-qc-inspector.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/content-verification-protocol.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-review-gate/SKILL.md
        requires: [T-CONTENT.COMPOSE]
        exit_gate: "workflow_gate.py:G_TECHNICAL_QC_PASS"
        output_class: internal_intermediate
        triggers: ["质检", "验片", "最终检验", "过检"]
        artifact_format_checks: [executor_tag, four_dimension_review]

      DELIVER:
        name: 交付
        legacy_ref: "huoshan#节点15"
        persona: wiki/personas/persona-operation.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/content-verification-protocol.md
          - /home/ubuntu/workflow/wiki/strategies/douyin-kuaishou-publishing-strategy.md
          - /home/ubuntu/workflow/wiki/strategies/xiaohongshu-publishing-strategy.md
          - /home/ubuntu/workflow/wiki/strategies/zhihu-wechat-video-publishing-strategy.md
          - /home/ubuntu/workflow/wiki/strategies/wechat-video-content-strategy.md
          - /home/ubuntu/workflow/wiki/strategies/wechat-public-account-strategy.md
        requires: [T-CONTENT.QC]
        exit_gate: "workflow_gate.py:G_DELIVERY_READY + feishu_send_gate.py"
        output_class: external_delivery
        triggers: ["交付", "发客户", "给客户", "对外", "发出去", "打包交付"]
