        artifact_format_checks: [executor_tag, local_file_exists, cost_recorded]

      COMPOSE:
        name: ffmpeg 合成+BGM+字幕
        legacy_ref: "huoshan#节点13"
        persona: wiki/personas/persona-post-editor.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/ffmpeg-synthesis-guide.md
