# HERMES_NODE_MAP.yaml — 五轨节点单一事实源
# 契约定位：L1 层。L0 框架层 SOUL 只认 <TRACK>.<NODE_ID>，业务细节全部落在本表与 L2 persona 文件。
# 下游读取方（本表即两者的唯一输入契约，改字段等于改契约，须同步改两处）：
#   1. /home/ubuntu/workflow/scripts/workflow_ticket.py   —— open/close/skip/status/classify
#   2. /home/ubuntu/.hermes/guard/node-entry-guard.py     —— pre_tool_call 进程级阻断，生成 block message 时调 classify
# 存量零改：huoshan SKILL.md（3595 行）、WORKFLOW_REGISTRY.yaml、小鹿 SOUL 16 节点表一律不动，
#   本表只加 legacy_ref / registry_ref 回指。新增即映射，不迁移。
# 依据：outputs/SOUL框架层改造方案_20260815.md §3（节点表）/§4.2（票据物理动作）/§5（三态）/§6.1（映射层字段形态）

meta:
  version: '1.0'
  update_date: '2026-08-15'
  note: >-
    五轨节点映射表。节点 ID 统一命名空间 <TRACK>.<NODE_ID>，全语义 ID，禁纯数字；
    数字仅允许出现在 legacy_ref 字符串内作回指。T-CONTENT 复用 huoshan 0–17 原编号不重排，
    T-OPS 沿用 WORKFLOW_REGISTRY 语义 ID 不新造。本表不新建任何内容门，
    T-CONTENT/T-OPS 出口闸一律委托既有门禁脚本。

  # 路径约定（下游脚本按此解析，不要自行猜测）
  path_roots:
    repo_root: /home/ubuntu/workflow          # persona 字段相对此根解析
    hermes_root: /home/ubuntu/.hermes         # guard / skills / scripts 所在
    persona_path_style: relative_to_repo_root # 与 §6.1 示例一致
    deps_path_style: absolute                 # deps 一律绝对路径，open 时逐个 os.path.isfile + size>0 校验

  # 字段字典（缺一不可的 8 个必填字段 + 3 个契约扩展字段）
  field_contract:
    required:
      - name           # 中文名
      - persona        # persona 文件路径（相对 repo_root）
      - deps           # 必读文档清单，绝对路径，open 时逐个校验存在且非空，缺一 rc=1
      - requires       # 上游节点 ID 全限定列表，用于 open 的顺序校验；[] 表示链首
      - exit_gate      # 出口闸：ticket_close / workflow_gate.py:G_XXX / review_gate.py:xxx / api-guard.sh / 组合
      - output_class   # internal_intermediate | internal_final | external_delivery
      - triggers       # 触发词列表，供 classify 打分
    backref_one_of:
      - legacy_ref     # 回指 huoshan 存量编号，如 "huoshan#节点2"
      - registry_ref   # 回指 WORKFLOW_REGISTRY 语义 ID，如 "TOPIC_EXPERIMENT"
      - none_new       # 新建轨节点无存量可回指，显式写 none_new: true，禁留空
    extensions:
      persona_status:  # ready | pending_create
        why: >-
          新增 persona 共 16 个尚未落盘（8–9 个编排/决策类 + 7 个运营类）。open 的物理动作第 4 步要把
          persona 全文打进上下文，文件不存在会直接 rc=1 把整轨锁死。故 pending_create 的节点
          open 时输出 `NEED_INFO: persona 未建 <path>` 并 rc=1，与"文件损坏"区分开，便于定位。
          persona 落盘后把本字段改 ready 即可，无需改 guard。
      client_view_export:  # 该节点产物存在客户可见视图（D_*），导出动作单独走对外交付态
        why: >-
          WORKFLOW_REGISTRY 里 client_view: D_* 的产物，A_* 本体是内部件、D_* 才是客户件。
          节点 output_class 按 A_* 本体判，导出 D_* 是独立的 OUTBOUND 动作，必须过脱敏 + feishu_send_gate.py。
          不把这些节点整体标 external_delivery，避免内部中间件被无谓脱敏。
      artifact_format_checks:  # close 时的格式硬校验项，对齐 AGENTS.md 产出物格式铁律
        why: 票据 close 只管 workflow_gate 不管的四件事之一——产物格式，规则集中在此，不散落 SOUL。

  # 轨级灰度开关（Phase 3 分轨转 enforce 用，不一刀切；对齐方案 §8.1 风险 R4 的回退粒度）
  # observe = guard 只记日志不阻断；enforce = 阻断生效。改这里不需要改 guard 代码。
  mode_default: observe

  status_codes:  # 只认这五种，禁自创
    - "OUTPUT:"
    - "BLOCKED:"
    - "MANUAL_REVIEW_REQUIRED:"   # rc=3，禁记 ALLOWED，禁向下游给获批哈希
    - "NEED_INFO:"
    - "COMPLIANCE:"

  known_blockers:
    - id: workflow_gate_no_approve
      detail: >-
        workflow_gate.py 当前只有 check/status，无 approve 子命令，19 门中 17 门 manual: true，
        可达 ALLOWED 的门为 0。T-OPS 全轨与 T-CONTENT 的 COPY/STORYBOARD/QC/DELIVER 出口闸都委托它，
        不先补 approve 通道则这些节点 close 后下游 open 必然 rc=3 死锁。
      hard_prerequisite: Phase 0-A（给 workflow_gate.py 补 approve <proj> <gate_id> --by --evidence）
      affects: [T-OPS.*, T-CONTENT.COPY, T-CONTENT.STORYBOARD, T-CONTENT.IMAGE_GEN, T-CONTENT.QC, T-CONTENT.DELIVER]
    - id: long_form_writing_quality_skill_missing
      detail: >-
        AGENTS.md 要求长篇/小说任务加载 newmedia-operations/long-form-writing-quality/SKILL.md，
        但该文件当前不在盘上。故本表任何节点的 deps 都未引用它——引用即 open 必 rc=1。
        补齐该 skill 后再挂进 T-CONTENT.COPY 的 deps。

# =====================================================================
# 五轨
# =====================================================================
tracks:

  # -------------------------------------------------------------------
  # T-CONTENT｜内容生产轨（映射 huoshan 0–17，零改存量）
  # 编号不重排：legacy_ref 回指 huoshan#节点N，本表 ID 全语义化。
  # 物理底线（huoshan 纸面铁律物理化，由闸一 TERMINAL 分支执行）：
  #   Bot 域节点（INFO_COLLECT…STORYBOARD）禁直连 Helper API(1888)/Seedance/Seedream/婵镜/火山 ARK，
  #   一切渲染 POST /execute(1889)。唯一例外：段1 经 Helper API /seedream 生图合法。
  # -------------------------------------------------------------------
  T-CONTENT:
    source: huoshan
    source_ref: /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/SKILL.md
    mode: observe
    note: >-
      修正一处存量不一致：huoshan 表把节点 7/13/16 标为「无独立人设」，但
      persona-material-collector.md / persona-post-editor.md / persona-publish-specialist.md
      实际存在。本表按文件实际存在挂上，不再走「框架默认规范」。存量表不改。
    nodes:

      INFO_COLLECT:
        name: 信息采集
        legacy_ref: "huoshan#节点0"
        persona: wiki/personas/persona-info-collector.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/industry-index.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-data-review/SKILL.md
        requires: []
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["信息采集", "客户资料", "建档", "新客户", "回头客", "门店信息"]
        artifact_format_checks: [executor_tag, assets_copied_to_project]

      USER_ANALYSIS:
        name: 用户分析
        legacy_ref: "huoshan#节点1"
        persona: wiki/personas/persona-user-analyst.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/human-drivers-library.md
          - /home/ubuntu/workflow/wiki/concepts/consumer-decision-models-knowledge.md
          - /home/ubuntu/workflow/wiki/concepts/behavioral-economics-marketing.md
          - /home/ubuntu/workflow/wiki/concepts/china-consumer-sociology.md
          - /home/ubuntu/workflow/wiki/concepts/industry-index.md
        requires: [T-CONTENT.INFO_COLLECT]
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["用户分析", "用户画像", "受众", "共情", "人性驱动力", "底层焦虑"]
        artifact_format_checks: [executor_tag, empathy_six_layers_present]

      DECONSTRUCT:
        name: 爆款拆解
        legacy_ref: "huoshan#节点2"
        persona: wiki/personas/persona-content-analyst.md
        persona_status: ready
        # 硬要求：video-deconstruction-framework.md 必须在 deps 里，缺则 open rc=1（方案 §4.2 第 5 步点名）
        deps:
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/video-deconstruction-framework.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/data-sourcing-strategy.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-data-review/SKILL.md
          - /home/ubuntu/workflow/wiki/concepts/industry-index.md
        requires: [T-CONTENT.USER_ANALYSIS]
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["拆解", "爆款", "对标", "为什么爆", "逐帧", "帧级", "同类内容", "标杆"]
        artifact_format_checks: [executor_tag, data_source_cited, no_fabricated_metrics]

      TOPIC:
        name: 选题
        legacy_ref: "huoshan#节点3"
        persona: wiki/personas/persona-strategy-editor.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/50-viral-hook-templates.md
          - /home/ubuntu/workflow/wiki/concepts/golden-3-seconds.md
          - /home/ubuntu/workflow/wiki/concepts/copywriting-spec.md
          - /home/ubuntu/workflow/wiki/concepts/industry-index.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-review-gate/SKILL.md
        requires: [T-CONTENT.DECONSTRUCT]
        exit_gate: "review_gate.py:node3_candidate"
        output_class: internal_intermediate
        triggers: ["选题", "拍什么", "题材", "内容方向", "选题实验"]
        artifact_format_checks: [executor_tag, candidate_count_ge_3, scored]

      COPY:
        name: 文案·纯台词本
        legacy_ref: "huoshan#节点4"
        persona: wiki/personas/persona-creative-director.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/emotion-psychology.md
          - /home/ubuntu/workflow/wiki/concepts/entity-store-30s-conversion-script-template.md
          - /home/ubuntu/workflow/wiki/concepts/copywriting-spec.md
          - /home/ubuntu/workflow/wiki/concepts/six-oral-styles.md
          - /home/ubuntu/workflow/wiki/concepts/xiaohongshu-title-and-copy-templates.md
          - /home/ubuntu/workflow/wiki/concepts/industry-strategy-overview.md
          - /home/ubuntu/workflow/wiki/concepts/compliance-checklist.md
          - /home/ubuntu/workflow/wiki/concepts/compliance-platform-rules.md
          - /home/ubuntu/workflow/wiki/concepts/industry-index.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-redlines/SKILL.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-review-gate/SKILL.md
        requires: [T-CONTENT.TOPIC]
        exit_gate: "workflow_gate.py:G_COPY_READY"
        output_class: internal_intermediate
        # 铁律：纯台词本只有台词。情绪/说话人/语气归 STORYBOARD，不许混进来。
        triggers: ["文案", "台词本", "口播", "脚本", "写文案", "改文案"]
        artifact_format_checks:
          - executor_tag
          - no_table            # 禁表格
          - no_shot_number      # 禁镜号
          - no_speaker_label    # 禁说话人/语气/情绪
          - three_versions_present
          - blind_review_top_score_ge_60

      STORYBOARD:
        name: 分镜脚本
        legacy_ref: "huoshan#节点5"
        persona: wiki/personas/persona-storyboard-artist.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/shotcraft-templates.md
          - /home/ubuntu/workflow/wiki/concepts/xiaolu-character-sheet.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/video-production/SKILL.md
        requires: [T-CONTENT.COPY]
        exit_gate: "workflow_gate.py:G_CREATIVE_READY"
        output_class: internal_intermediate
        triggers: ["分镜", "镜号", "运镜", "景别", "镜头", "分镜表"]
        artifact_format_checks:
          - executor_tag
          - eight_columns            # 8 列分镜表
          - talking_head_segments_min_le_15s # 口播分段：快乐马r2v单段3-15秒；能一段出完不拆、段数取最小；同段可多角色/多镜头，禁止一句一段
          - no_fast_speech_prompt    # 禁「语速快」，一律「语速适中，吐字清晰」
          - total_duration_within_tolerance

      CHAR_DESIGN:
        name: 视觉人设
        legacy_ref: "huoshan#节点6"
        persona: wiki/personas/persona-character-designer.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/ai-short-drama-workflow-merged.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/ai-image-gen-strategy/SKILL.md
        # 与 STORYBOARD 并行（互不依赖），同挂 COPY 之后
        requires: [T-CONTENT.COPY]
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["视觉人设", "人设稿", "角色设计", "形象统一", "锁脸"]
        artifact_format_checks: [executor_tag, appearance_locked_fields]

      ASSET_SUM_A:
        name: 素材汇总A
        legacy_ref: "huoshan#节点7"
        persona: wiki/personas/persona-material-collector.md
        persona_status: ready
        deps:
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/relay-document-template.md
        # 等 5+6 双签收
        requires: [T-CONTENT.STORYBOARD, T-CONTENT.CHAR_DESIGN]
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["素材汇总", "素材清单", "素材齐不齐"]
        artifact_format_checks: [executor_tag, asset_usage_mapped_per_shot]

      IMAGE_GEN:
        name: Seedream 生图
        legacy_ref: "huoshan#节点8"
        persona: wiki/personas/persona-ai-painter.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/seedream-realistic-portrait-guide.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/five-layer-prompt-structure.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/volcano-bypass-three-view-format.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/ai-image-gen-strategy/SKILL.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/cost-reference.md
        requires: [T-CONTENT.ASSET_SUM_A]
        exit_gate: "api-guard.sh:check + workflow_gate.py:G_RENDER_READY"
        output_class: internal_intermediate
        triggers: ["生图", "Seedream", "三视图", "彩铅", "配图", "出图"]
        artifact_format_checks: [executor_tag, local_file_exists, three_view_structure]

      ASSET_SUM_B:
        name: 素材汇总B
        legacy_ref: "huoshan#节点9"
        # 复用 material-collector（存量标「框架执行」，本表按文件实际存在挂上）
        persona: wiki/personas/persona-material-collector.md
        persona_status: ready
        deps:
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/relay-document-template.md
        requires: [T-CONTENT.IMAGE_GEN]
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["素材汇总B", "图片清单", "参考图归档"]
        artifact_format_checks: [executor_tag, absolute_paths_only]

      PROMPT:
        name: 提示词
        legacy_ref: "huoshan#节点10"
        persona: wiki/personas/persona-prompt-engineer.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/img2img-template.md
          - /home/ubuntu/workflow/wiki/concepts/seedance-director-prompt-dual-system.md
          - /home/ubuntu/workflow/wiki/concepts/seedance-prompt-template-library.md
          - /home/ubuntu/workflow/wiki/concepts/seedance-prompt-enhancement.md
          - /home/ubuntu/workflow/wiki/concepts/seedance-2.0-prompt-formula.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/maicai-prompt-structure.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/maiya-seedance-prompt-style.md
          - /home/ubuntu/workflow/wiki/concepts/seven-pitfalls.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/video-production/SKILL.md
        requires: [T-CONTENT.ASSET_SUM_B]
        exit_gate: ticket_close
        output_class: internal_intermediate
        triggers: ["提示词", "prompt", "四层结构", "图生图", "逐镜提示词"]
        artifact_format_checks:
          - executor_tag
          - per_shot_ref_expanded    # 每镜必须实际展开 @图1/@图2，禁「同上」「沿用前镜」
          - ref_abs_path_bound       # @图1/@图2 绑定真实绝对路径并注明仅作人物/场景参考
          - character_scene_lock_per_shot
          - no_fast_speech_prompt

      PROMPT_QC:
        name: 提示词质检
        legacy_ref: "huoshan#节点11"
        persona: wiki/personas/persona-compliance-auditor.md
        persona_status: ready
        deps:
          - /home/ubuntu/workflow/wiki/concepts/seedance-director-prompt-dual-system.md
          - /home/ubuntu/workflow/wiki/concepts/seedance-prompt-template-library.md
          - /home/ubuntu/workflow/wiki/concepts/seedance-2.0-prompt-formula.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/huoshan/references/five-layer-prompt-structure.md
          - /home/ubuntu/.hermes/skills/newmedia-operations/content-redlines/SKILL.md
        requires: [T-CONTENT.PROMPT]
        exit_gate: "review_gate.py:node12_pre"
        output_class: internal_intermediate
        triggers: ["提示词质检", "质检", "逐条对照", "预检"]
        artifact_format_checks: [executor_tag, checklist_item_by_item]

      RENDER:
        name: Seedance 视频
        legacy_ref: "huoshan#节点12"
        persona: wiki/personas/persona-render-engineer.md
        persona_status: ready
        deps:
