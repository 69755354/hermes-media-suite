# WORKFLOW_REGISTRY.yaml — 工作流单一事实源（2026-08-10 语义ID化）
# 节点数字只做排序；依赖/文件/门禁/日志一律用语义ID
# 依据：wiki/spec/工作流按交付物重构方案.md

meta:
  version: '1.0'
  update_date: '2026-08-10'
  note: 语义ID注册表。旧数字编号只读兼容，新项目一律走语义ID。

nodes:
  PROJECT_CHARTER:
    display_order: 0
    name: 合作立项与资料建档
    produces: [A_PROJECT_CHARTER, A_STORE_FACTS, A_ASSET_REGISTER, A_RIGHTS_REGISTER, A_AUTHORIZATION_REGISTER]
    requires: []
    exit_gate: G_PROJECT_AUTHORIZED
  BUSINESS_DIAGNOSIS:
    display_order: 1
    name: 门店经营诊断
    produces: [A_BUSINESS_DIAGNOSIS, A_BASELINE_LEDGER, A_CAPACITY_PROFILE, A_DATA_GAPS]
    requires: [A_PROJECT_CHARTER, A_STORE_FACTS, A_AUTHORIZATION_REGISTER]
    exit_gate: G_BUSINESS_BASELINE_READY
  MARKET_INSIGHT:
    display_order: 2
    name: 顾客、商圈、竞争与内容洞察
    produces: [A_AUDIENCE_PROFILE, A_LOCAL_COMPETITOR_SCAN, A_CONTENT_BENCHMARKS, A_MATERIAL_BLOCKLIST]
    requires: [A_BUSINESS_DIAGNOSIS, A_STORE_FACTS]
  OFFER_PATH:
    display_order: 3
    name: 主推项目与预约路径设计
    produces: [A_OFFER_PORTFOLIO, A_UNIT_ECONOMICS, A_OFFER_PATH, A_CAPACITY_GUARD]
    requires: [A_BUSINESS_DIAGNOSIS, A_AUDIENCE_PROFILE]
    exit_gate: G_OFFER_VIABLE
  GROWTH_STRATEGY:
    display_order: 4
    name: 平台选择与整体打法
    produces: [A_GROWTH_PLAYBOOK, A_FUNNEL_TARGETS, A_BUDGET_GUARDRAIL, A_RISK_PLAN]
    requires: [A_BUSINESS_DIAGNOSIS, A_AUDIENCE_PROFILE, A_LOCAL_COMPETITOR_SCAN, A_CONTENT_BENCHMARKS, A_OFFER_PATH]
    exit_gate: G_STRATEGY_BY_CODEX
  OPERATING_INFRA:
    display_order: 5
    name: 账号、门店位置、预约与数据基建
    produces: [A_ACCOUNT_BASELINE, A_POI_CHECK, A_BOOKING_ENTRY_CHECK, A_TRACKING_SPEC, A_DUTY_ROSTER]
    requires: [A_GROWTH_PLAYBOOK, A_OFFER_PATH]
    exit_gate: G_INFRA_READY_FOR_PUBLISH
  CONTENT_CALENDAR:
    display_order: 6
    name: 周月内容矩阵与排期
    produces: [A_CONTENT_MATRIX, A_CONTENT_CALENDAR, A_MATERIAL_PLAN, A_CYCLE_BUDGET]
    requires: [A_GROWTH_PLAYBOOK, A_OFFER_PATH, A_TRACKING_SPEC]
    exit_gate: G_CONTENT_PLAN_READY
  TOPIC_EXPERIMENT:
    display_order: 7
    name: 选题实验
    produces: [A_TOPIC_CANDIDATES, A_TOPIC_EXPERIMENTS, A_TOPIC_FINAL, A_EXTERNAL_CALIBRATION]
    requires: [A_CONTENT_CALENDAR, A_GROWTH_PLAYBOOK, A_AUDIENCE_PROFILE, A_LOCAL_COMPETITOR_SCAN, A_CONTENT_BENCHMARKS, A_MATERIAL_BLOCKLIST]
    exit_gate: G_TOPIC_READY
  COPY_PACKAGE:
    display_order: 8
    name: 多版文案与平台版本
    produces: [A_COPY_VERSION_1, A_COPY_VERSION_2, A_COPY_VERSION_3, A_COPY_FINAL, A_PLATFORM_COPY_PACK, A_COPY_REVIEW, A_COPY_APPROVAL]
    requires: [A_TOPIC_FINAL, A_OFFER_PATH, A_GROWTH_PLAYBOOK, A_CONTENT_CALENDAR, A_MATERIAL_BLOCKLIST]
    exit_gate: G_COPY_READY
  CREATIVE_BLUEPRINT:
    display_order: 9
    name: 分镜、画面与视觉基线
    produces: [A_STORYBOARD, A_VISUAL_BIBLE, A_VOICE_BASELINE, A_SCENE_ASSET_MAP, A_SHOT_REQUIREMENTS]
    requires: [A_COPY_FINAL, A_ASSET_REGISTER, A_RIGHTS_REGISTER]
    exit_gate: G_CREATIVE_READY
    validation:
      target_total_duration_seconds: null   # 项目级时长由 PROJECT_CHARTER 指定；null=不检查（2026-08-20 架构修复 P0.2）
      total_duration_tolerance_seconds: 1
      max_shot_duration_seconds: 15
      talking_head_max_shot_duration_seconds: 15
  MEDIA_PREP:
    display_order: 10
    name: 素材与生成准备
    produces: [A_ASSET_MANIFEST, A_GENERATED_ASSETS, A_PROMPT_PACKAGE, A_PROMPT_QC, A_RENDER_BUDGET_APPROVAL]
    requires: [A_STORYBOARD, A_VISUAL_BIBLE, A_ASSET_REGISTER]
    exit_gate: G_RENDER_READY
  MEDIA_PRODUCTION:
    display_order: 11
    name: 成片图文制作与技术检验
    produces: [A_VIDEO_MASTER, A_IMAGE_SET, A_ARTICLE_LAYOUT, A_COVER, A_SUBTITLES, A_TECH_QC, A_ACTUAL_COST, A_COST_LEDGER]
    requires: [A_ASSET_MANIFEST, A_PROMPT_PACKAGE, A_PROMPT_QC, A_RENDER_BUDGET_APPROVAL]
    exit_gate: G_TECHNICAL_QC_PASS
  DELIVERY_PACKAGE:
    display_order: 12
    name: 内容终检与发布承接包
    produces: [A_FINAL_REVIEW, A_MEDIA_DELIVERY, A_PUBLISH_PACKAGE, A_PUBLISH_GUIDE, A_RESPONSE_PLAYBOOK, A_TRACE_CODE_SET, A_DELIVERY_RECORD]
    requires: [A_VIDEO_MASTER, A_IMAGE_SET, A_GROWTH_PLAYBOOK, A_CONTENT_CALENDAR, A_OFFER_PATH, A_TRACKING_SPEC]
    exit_gate: G_DELIVERY_READY
  PUBLISH_OPERATE:
    display_order: 13
    name: 发布上线与首轮运营
    produces: [A_PUBLISH_LOG, A_ONLINE_EVIDENCE, A_FIRST_RESPONSE_LOG, A_PUBLISH_EXCEPTION]
    requires: [A_PUBLISH_PACKAGE, A_PUBLISH_GUIDE, A_TRACKING_SPEC, A_DUTY_ROSTER]
    exit_gate: G_PUBLISH_READY
  LEAD_OPERATION:
    display_order: 14
    name: 评论私信与公域线索运营
    produces: [A_INTERACTION_LOG, A_LEAD_LEDGER, A_LEAD_CLASSIFICATION, A_RISK_ESCALATION_LOG]
    requires: [A_PUBLISH_LOG, A_RESPONSE_PLAYBOOK, A_DUTY_ROSTER]
    exit_gate: G_LEAD_CAPTURED
  CONVERSION_OPERATION:
    display_order: 15
    name: 预约、到店、成交与履约
    produces: [A_APPOINTMENT_LEDGER, A_ARRIVAL_LEDGER, A_ORDER_LEDGER, A_FULFILLMENT_LEDGER, A_NO_SHOW_FOLLOWUP]
    requires: [A_LEAD_LEDGER, A_OFFER_PATH, A_TRACKING_SPEC]
    exit_gate: G_CONVERSION_RECORDED
  RETENTION_OPERATION:
    display_order: 16
    name: 复购与转介绍运营
    produces: [A_SERVICE_FOLLOWUP, A_RETENTION_LEDGER, A_REFERRAL_LEDGER, A_REVIEW_RIGHTS]
    requires: [A_FULFILLMENT_LEDGER, A_OFFER_PATH]
    exit_gate: G_RETENTION_LOOP_READY
  WEEKLY_REVIEW:
    display_order: 17
    name: 每周数据归因与调整
    produces: [A_WEEKLY_REVIEW, A_ATTRIBUTION_REPORT, A_PROBLEM_OWNERSHIP, A_NEXT_WEEK_ACTIONS, A_EXPERIMENT_BACKLOG]
    requires: [A_PUBLISH_LOG, A_LEAD_LEDGER, A_ORDER_LEDGER, A_FULFILLMENT_LEDGER, A_RETENTION_LEDGER, A_COST_LEDGER]
    exit_gate: G_WEEKLY_REVIEW_READY
  MONTHLY_CLOSE:
    display_order: 18
    name: 月度经营报告与下周期方案
    produces: [A_MONTHLY_OPERATING_REPORT, A_MONTHLY_COST_REPORT, A_NEXT_CYCLE_PLAN, A_BUDGET_REVISION, A_RENEWAL_SCOPE]
    requires: [A_WEEKLY_REVIEW, A_ATTRIBUTION_REPORT, A_ORDER_LEDGER, A_FULFILLMENT_LEDGER, A_PUBLISH_LOG]
    exit_gate: G_CYCLE_CLOSED

