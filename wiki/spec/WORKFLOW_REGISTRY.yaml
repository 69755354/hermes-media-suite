gates:
  # 未接入自动执行器的检查显式标为人工，统一入口不得静默放行。
  # 会话级门（无生产节点、无产物）：由 workflow_gate.py 读 env 的会话上下文自动判定。
  G_CLIENT_CONTEXT_LOADED:
    checks:
      - {id: client_context_loaded, implemented: true}
  G_PROJECT_AUTHORIZED: {checks: [{id: project_authorization, implemented: false, manual: true}]}
  G_BUSINESS_BASELINE_READY: {checks: [{id: business_baseline, implemented: false, manual: true}]}
  G_OFFER_VIABLE: {checks: [{id: offer_viability, implemented: false, manual: true}]}
  G_INFRA_READY_FOR_PUBLISH: {checks: [{id: operating_infra, implemented: false, manual: true}]}
  G_CONTENT_PLAN_READY: {checks: [{id: content_plan, implemented: false, manual: true}]}
  G_TOPIC_READY:
    checks:
      - {id: topic_review, implemented: true, manual: true}
  G_COPY_READY:
    checks:
      - {id: copy_review, implemented: true, manual: true}
  G_CREATIVE_READY:
    checks:
      - {id: artifact_schema, implemented: true}
      - {id: storyboard_dual_parser, implemented: true}
      - {id: voice_policy, implemented: true}
      - {id: huolong_six_storyboard, implemented: true}
      - {id: upstream_artifact_hashes, implemented: true}
  G_RENDER_READY:
    checks:
      - {id: three_view_structure, implemented: true}
      - {id: render_readiness, implemented: false, manual: true}
  G_TECHNICAL_QC_PASS:
    checks:
      - {id: technical_qc, implemented: false, manual: true}
      - {id: huolong_six_subtitle, implemented: true}
  G_DELIVERY_READY:
    checks:
      - {id: delivery_review, implemented: true, manual: true}
  G_PUBLISH_READY: {checks: [{id: publish_review, implemented: false, manual: true}]}
  G_LEAD_CAPTURED: {checks: [{id: lead_review, implemented: false, manual: true}]}
  G_CONVERSION_RECORDED: {checks: [{id: conversion_review, implemented: false, manual: true}]}
  G_RETENTION_LOOP_READY: {checks: [{id: retention_review, implemented: false, manual: true}]}
  G_WEEKLY_REVIEW_READY: {checks: [{id: weekly_review, implemented: false, manual: true}]}
  G_CYCLE_CLOSED: {checks: [{id: monthly_close, implemented: false, manual: true}]}
  G_STRATEGY_BY_CODEX:
    checks:
      - {id: legacy_strategy_score, implemented: true}
      - {id: produced_by_codex, implemented: true}
      - {id: upstream_artifact_hashes, implemented: true}
