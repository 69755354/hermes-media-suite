# > 执行者：codex｜对应架构 v2.0 §5.2、§7.5、§10.5、§17.2（CR-10）

meta:
  contract_id: CLIENT_VIEW_CATALOG
  version: "1.0.0"
  status: frozen
  frozen_at: "2026-08-16"
  source_architecture: outputs/客户运营工作流可视化平台_架构v2_20260816.md
  source_sections: ["5.2", "7.5", "10.5", "17.2"]
  id_pattern: '^D_[A-Z0-9_]+$'
  source_id_pattern: '^A_[A-Z0-9_]+$'
  required_view_keys:
    - sources
    - renderer
    - redaction
    - version
    - required_fields
    - download_policy
  export_rules:
    render_mode: whitelist_rerender
    copy_and_redact_forbidden: true
    export_independent_of_show_process: true
    external_forbidden_scan_after_render: true
    expose_server_path: false

redaction_policies:
  strict_external:
    allow_only_required_fields: true
    strip_executor_markers: true
    forbidden_patterns:
      - '/home/ubuntu/'
      - '/tmp/projects/'
      - 'MEDIA:'
      - 'T-[A-Z0-9_-]+'
      - '节点[0-9]+'
      - '(?i)codex|claude|deepseek'
      - '执行者'
    on_match: BLOCKED

download_policies:
  none:
    mode: none
  inline_html:
    mode: inline
    content_types: [text/html]
  signed_binary:
    mode: signed_token
    token_ttl_seconds: 900
    allow_range: true
    formal_only: true
    path_in_response: false
  signed_bundle:
    mode: signed_token
    token_ttl_seconds: 900
    allow_range: true
    pre_generated: true
    formal_only: true
    path_in_response: false

